workflows:
  ios-workflow:
    name: Color Rush — iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # nome exatamente igual ao que foi dado à API key ao salvar a
      # integração em Codemagic > Settings > Integrations > Apple Developer
      # Portal (a chave está salva lá como "Color Rush", não "Codemagic" —
      # tem que bater letra por letra, é o que permite a assinatura
      # automática buscar/gerar o provisioning profile sozinha).
      app_store_connect: Color Rush
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.colorrush.app
      vars:
        BUNDLE_ID: "br.com.colorrush.app"
        XCODE_WORKSPACE: "app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Instalar dependências (npm)
        script: |
          cd app
          npm install
      - name: Garantir capacitor.config.json e www/ (à prova de upload incompleto)
        script: |
          # escreve esses dois arquivos direto no build, em vez de confiar
          # cegamente no que foi upado manualmente pro GitHub — assim o build
          # nunca quebra por causa de um arquivo que não subiu certo.
          cd app
          mkdir -p www
          test -f www/index.html || printf '%s' '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>Color Rush</body></html>' > www/index.html
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "br.com.colorrush.app",
            "appName": "Color Rush",
            "webDir": "www",
            "server": {
              "url": "https://colorrush.com.br",
              "cleartext": false
            },
            "ios": {
              "contentInset": "always"
            }
          }
          EOF
      - name: Adicionar/atualizar a plataforma iOS (Capacitor)
        script: |
          # "set -e" pra qualquer falha aqui parar o build na hora, em vez de
          # deixar passar batido e só quebrar de forma confusa lá na frente
          # (foi o que aconteceu: o Podfile não existia porque essa etapa
          # tinha "passado" rápido demais sem realmente ter dado certo).
          # Também apaga qualquer pasta ios/ velha antes, pra nunca reusar
          # restos de uma tentativa anterior.
          set -e
          cd app
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          echo "--- conteúdo de ios/App (conferência) ---"
          ls -la ios/App
          test -f ios/App/Podfile || (echo "ERRO: Podfile não foi gerado pelo cap add ios" && exit 1)
      - name: Declarar isenção de criptografia (evita a pergunta manual a cada envio)
        script: |
          # o app só usa HTTPS/TLS padrão do sistema (Firebase) — isso é
          # "uso isento" de criptografia pra fins de compliance de exportação,
          # então já marca isso direto no Info.plist gerado pelo cap add ios,
          # em vez de responder essa pergunta manualmente toda vez que subir
          # uma build no App Store Connect.
          PLIST="app/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
      - name: Instalar dependências nativas (CocoaPods)
        script: |
          cd app/ios/App
          pod install
      - name: Configurar assinatura de código
        script: |
          xcode-project use-profiles
      - name: Build do .ipa
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - igortmr@gmail.com
        notify:
          success: true
          failure: true
