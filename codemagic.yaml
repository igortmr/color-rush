workflows:
  ios-workflow:
    name: Color Rush — iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # nome exatamente igual ao que foi dado à API key ao salvar a
      # integração em Codemagic > Settings > Integrations > Apple Developer
      # Portal (a chave está salva lá como "Color Rush", não "Codemagic" —
      # tem que bater letra por letra, é o que permite a assinatura
      # automática buscar/gerar o provisioning profile sozinha).
      app_store_connect: Color Rush
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.colorrush.app
      vars:
        BUNDLE_ID: "br.com.colorrush.app"
        # Capacitor 8.x usa Swift Package Manager por padrão (pasta
        # CapApp-SPM), não CocoaPods — por isso não existe .xcworkspace,
        # e sim só o .xcodeproj mesmo. O Xcode resolve os pacotes SPM
        # sozinho na hora do build, sem precisar de um passo separado
        # (era isso que o antigo "pod install" tentava fazer, mas não
        # existe mais Podfile nessa versão).
        XCODE_PROJECT: "app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
    scripts:
      - name: Instalar dependências (npm)
        script: |
          cd app
          npm install
      - name: Garantir capacitor.config.json e www/ (à prova de upload incompleto)
        script: |
          # escreve esses dois arquivos direto no build, em vez de confiar
          # cegamente no que foi upado manualmente pro GitHub — assim o build
          # nunca quebra por causa de um arquivo que não subiu certo.
          cd app
          mkdir -p www
          test -f www/index.html || printf '%s' '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>Color Rush</body></html>' > www/index.html
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "br.com.colorrush.app",
            "appName": "Color Rush",
            "webDir": "www",
            "server": {
              "url": "https://colorrush.com.br",
              "cleartext": false
            },
            "ios": {
              "contentInset": "always"
            }
          }
          EOF
      - name: Adicionar/atualizar a plataforma iOS (Capacitor)
        script: |
          # "set -e" pra qualquer falha aqui parar o build na hora, em vez de
          # deixar passar batido e só quebrar de forma confusa lá na frente
          # (foi o que aconteceu: o Podfile não existia porque essa etapa
          # tinha "passado" rápido demais sem realmente ter dado certo).
          # Também apaga qualquer pasta ios/ velha antes, pra nunca reusar
          # restos de uma tentativa anterior.
          set -e
          cd app
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          echo "--- conteúdo de ios/App (conferência) ---"
          ls -la ios/App
          test -d ios/App/App.xcodeproj || (echo "ERRO: App.xcodeproj não foi gerado pelo cap add ios" && exit 1)
      - name: Gerar e aplicar o ícone real do app (substitui o placeholder do Capacitor)
        script: |
          # o cap add ios sempre recria o ícone padrão do Capacitor (o "X"
          # genérico) do zero. Em vez de depender de um PNG ter subido certo
          # pro GitHub (já tomamos um susto com isso no capacitor.config.json),
          # o ícone de verdade (mesmo desenho "tabuleiro" 2x2 já usado no
          # PWA/Android: fundo escuro + quadrados vermelho/azul/verde/amarelo)
          # é gerado aqui na hora, só com a biblioteca padrão do Python (zlib),
          # sem precisar de Pillow nem de nenhum arquivo externo.
          set -e
          cd app
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -d "$ICONSET" || (echo "ERRO: AppIcon.appiconset não encontrado em $ICONSET" && exit 1)

          python3 << 'PYEOF'
          import zlib, struct

          SIZE = 1024
          BG = (14, 18, 36)
          RED = (255, 45, 107)
          BLUE = (45, 214, 255)
          GREEN = (33, 230, 161)
          YELLOW = (255, 233, 60)

          safe = int(SIZE * 0.52)
          x0 = (SIZE - safe) // 2
          y0 = (SIZE - safe) // 2
          gap = int(safe * 0.09)
          sq = (safe - gap) // 2
          radius = int(sq * 0.22)

          quads = [
              (x0, y0, RED),
              (x0 + sq + gap, y0, BLUE),
              (x0, y0 + sq + gap, GREEN),
              (x0 + sq + gap, y0 + sq + gap, YELLOW),
          ]

          def inside_rounded(lx, ly, w, h, r):
              if lx < r and ly < r:
                  return (lx - r) ** 2 + (ly - r) ** 2 <= r * r
              if lx >= w - r and ly < r:
                  return (lx - (w - r)) ** 2 + (ly - r) ** 2 <= r * r
              if lx < r and ly >= h - r:
                  return (lx - r) ** 2 + (ly - (h - r)) ** 2 <= r * r
              if lx >= w - r and ly >= h - r:
                  return (lx - (w - r)) ** 2 + (ly - (h - r)) ** 2 <= r * r
              return 0 <= lx < w and 0 <= ly < h

          def pixel_color(px, py):
              for qx, qy, color in quads:
                  lx, ly = px - qx, py - qy
                  if 0 <= lx < sq and 0 <= ly < sq and inside_rounded(lx, ly, sq, sq, radius):
                      return color
              return BG

          raw = bytearray()
          for y in range(SIZE):
              raw.append(0)
              for x in range(SIZE):
                  raw += bytes(pixel_color(x, y))

          compressed = zlib.compress(bytes(raw), 9)

          def chunk(tag, data):
              return (struct.pack('>I', len(data)) + tag + data +
                      struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff))

          sig = b'\x89PNG\r\n\x1a\n'
          ihdr = struct.pack('>IIBBBBB', SIZE, SIZE, 8, 2, 0, 0, 0)
          png = sig + chunk(b'IHDR', ihdr) + chunk(b'IDAT', compressed) + chunk(b'IEND', b'')

          with open('appicon-1024.png', 'wb') as f:
              f.write(png)
          print('appicon-1024.png gerado:', len(png), 'bytes')
          PYEOF

          # aplica no(s) slot(s) de 1024x1024 do Contents.json gerado pelo cap
          # add ios (formato "single size" do Xcode 14+, que é o que o
          # Capacitor 8 usa); se não achar nenhum slot de 1024, aplica em
          # todos como último recurso.
          python3 - << 'PYEOF'
          import json, shutil, os
          iconset = "ios/App/App/Assets.xcassets/AppIcon.appiconset"
          with open(os.path.join(iconset, "Contents.json")) as f:
              data = json.load(f)
          images = data.get("images", [])
          targets = [img for img in images if img.get("size") == "1024x1024"] or images
          for img in targets:
              fn = img.get("filename")
              if fn:
                  shutil.copyfile("appicon-1024.png", os.path.join(iconset, fn))
                  print("ícone aplicado em", fn)
          PYEOF
      - name: Declarar isenção de criptografia (evita a pergunta manual a cada envio)
        script: |
          # o app só usa HTTPS/TLS padrão do sistema (Firebase) — isso é
          # "uso isento" de criptografia pra fins de compliance de exportação,
          # então já marca isso direto no Info.plist gerado pelo cap add ios,
          # em vez de responder essa pergunta manualmente toda vez que subir
          # uma build no App Store Connect.
          PLIST="app/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
      - name: Configurar assinatura de código
        script: |
          xcode-project use-profiles
      - name: Incrementar número da build (evita duplicidade no App Store Connect)
        script: |
          # o projeto iOS nasce do zero a cada build (rm -rf ios), sempre com
          # o número "1" — e a Apple recusa reenviar um número já usado pra
          # mesma versão. $BUILD_NUMBER é uma variável própria do Codemagic
          # que já vem incrementando sozinha a cada build deste app.
          cd app/ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build do .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - igortmr@gmail.com
        notify:
          success: true
          failure: true
