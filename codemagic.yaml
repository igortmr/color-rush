workflows:
  ios-workflow:
    name: Color Rush — iOS (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # nome exatamente igual ao que foi dado à API key ao salvar a
      # integração em Codemagic > Settings > Integrations > Apple Developer
      # Portal (a chave está salva lá como "Color Rush", não "Codemagic" —
      # tem que bater letra por letra, é o que permite a assinatura
      # automática buscar/gerar o provisioning profile sozinha).
      app_store_connect: Color Rush
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.colorrush.app
      vars:
        BUNDLE_ID: "br.com.colorrush.app"
        # Capacitor 8.x usa Swift Package Manager por padrão (pasta
        # CapApp-SPM), não CocoaPods — por isso não existe .xcworkspace,
        # e sim só o .xcodeproj mesmo. O Xcode resolve os pacotes SPM
        # sozinho na hora do build, sem precisar de um passo separado
        # (era isso que o antigo "pod install" tentava fazer, mas não
        # existe mais Podfile nessa versão).
        XCODE_PROJECT: "app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # CFBundleShortVersionString ("versão" visível na App Store, ex.
        # "1.1.1"). A Apple recusa reenviar uma versão igual ou menor que a
        # última aprovada -- diferente do número de build ($BUILD_NUMBER
        # logo abaixo, que o Codemagic já incrementa sozinho), essa aqui
        # precisa ser subida manualmente aqui toda vez que fizer uma nova
        # submissão pro App Store depois da última já aprovada (1.1).
        # 1.1.3: a 1.1.2 já deve estar em submissão/revisão -- não dá pra
        # editar um binário já enviado. 1.1.3 adiciona o entitlement
        # aps-environment (ver App.entitlements abaixo), que faltava desde
        # sempre -- sem ele o registro de push (PushNotifications.register())
        # falha silenciosamente no lado nativo mesmo com permissão concedida
        # e o código JS certo (initNativePush em auth.js), então NENHUMA
        # conta jamais teve token registrado, mesmo depois da correção de JS
        # anterior (que só resolvia metade do problema).
        XCODE_MARKETING_VERSION: "1.1.3"
      node: latest
      xcode: latest
    scripts:
      - name: Instalar dependências (npm)
        script: |
          cd app
          npm install
      - name: Garantir capacitor.config.json e www/ (à prova de upload incompleto)
        script: |
          # escreve esses dois arquivos direto no build, em vez de confiar
          # cegamente no que foi upado manualmente pro GitHub — assim o build
          # nunca quebra por causa de um arquivo que não subiu certo.
          cd app
          mkdir -p www
          test -f www/index.html || printf '%s' '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>Color Rush</body></html>' > www/index.html
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "br.com.colorrush.app",
            "appName": "Color Rush",
            "webDir": "www",
            "backgroundColor": "#ff050810",
            "server": {
              "url": "https://colorrush.com.br",
              "cleartext": false
            },
            "ios": {
              "contentInset": "always",
              "backgroundColor": "#ff050810"
            },
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["apple.com", "google.com"]
              }
            }
          }
          EOF
      - name: Adicionar/atualizar a plataforma iOS (Capacitor)
        script: |
          # "set -e" pra qualquer falha aqui parar o build na hora, em vez de
          # deixar passar batido e só quebrar de forma confusa lá na frente
          # (foi o que aconteceu: o Podfile não existia porque essa etapa
          # tinha "passado" rápido demais sem realmente ter dado certo).
          # Também apaga qualquer pasta ios/ velha antes, pra nunca reusar
          # restos de uma tentativa anterior.
          set -e
          cd app
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          echo "--- conteúdo de ios/App (conferência) ---"
          ls -la ios/App
          test -d ios/App/App.xcodeproj || (echo "ERRO: App.xcodeproj não foi gerado pelo cap add ios" && exit 1)
      - name: Gerar e aplicar o ícone real do app (substitui o placeholder do Capacitor)
        script: |
          # o cap add ios sempre recria o ícone padrão do Capacitor (o "X"
          # genérico) do zero. O ícone de verdade agora é o PNG 1024x1024
          # commitado em icons/appicon-1024.png (mesma arte usada no favicon/
          # PWA), só copiado pro slot certo do appiconset — checagem de
          # tamanho mínimo abaixo pra falhar alto caso o PNG não tenha vindo
          # certo do GitHub, em vez de aplicar um arquivo vazio/corrompido
          # silenciosamente.
          set -e
          cd app
          ICONSET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -d "$ICONSET" || (echo "ERRO: AppIcon.appiconset não encontrado em $ICONSET" && exit 1)

          cp ../icons/appicon-1024.png appicon-1024.png
          SIZE_BYTES=$(wc -c < appicon-1024.png)
          test "$SIZE_BYTES" -gt 10000 || (echo "ERRO: appicon-1024.png suspeito demais pequeno ($SIZE_BYTES bytes)" && exit 1)
          echo "appicon-1024.png copiado: $SIZE_BYTES bytes"

          # aplica no(s) slot(s) de 1024x1024 do Contents.json gerado pelo cap
          # add ios (formato "single size" do Xcode 14+, que é o que o
          # Capacitor 8 usa); se não achar nenhum slot de 1024, aplica em
          # todos como último recurso.
          python3 - << 'PYEOF'
          import json, shutil, os
          iconset = "ios/App/App/Assets.xcassets/AppIcon.appiconset"
          with open(os.path.join(iconset, "Contents.json")) as f:
              data = json.load(f)
          images = data.get("images", [])
          targets = [img for img in images if img.get("size") == "1024x1024"] or images
          for img in targets:
              fn = img.get("filename")
              if fn:
                  shutil.copyfile("appicon-1024.png", os.path.join(iconset, fn))
                  print("ícone aplicado em", fn)
          PYEOF
      - name: Configurar login nativo (Google + Apple Sign-In via @capacitor-firebase/authentication)
        script: |
          # Login com Google/Apple dentro do app precisa ser NATIVO (não
          # WebView) — o Google recusa completar OAuth dentro de uma WebView
          # genérica embutida (é reconhecida como "disallowed_useragent") e
          # empurra pro Safari de verdade, que não devolve o resultado pro
          # app (são contextos/sessões separados). O plugin
          # @capacitor-firebase/authentication usa as telas nativas de
          # verdade (ASAuthorizationController da Apple / SDK nativo do
          # Google), sem passar por WebView nenhuma.
          #
          # GoogleService-Info.plist não é segredo (config pública do app,
          # baixado do Firebase Console) — diferente do .p8 da Apple, por
          # isso pode ficar direto aqui no script, sem precisar de secret.
          set -e
          cd app
          cat > ios/App/App/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>CLIENT_ID</key>
          	<string>988545815222-h08gpkp7bmc2usii6040d62eh9qlqq4r.apps.googleusercontent.com</string>
          	<key>REVERSED_CLIENT_ID</key>
          	<string>com.googleusercontent.apps.988545815222-h08gpkp7bmc2usii6040d62eh9qlqq4r</string>
          	<key>API_KEY</key>
          	<string>AIzaSyCYy5ca6m8vo4e9rZ6hyjb4ABBWBVCxgKU</string>
          	<key>GCM_SENDER_ID</key>
          	<string>988545815222</string>
          	<key>PLIST_VERSION</key>
          	<string>1</string>
          	<key>BUNDLE_ID</key>
          	<string>br.com.colorrush.app</string>
          	<key>PROJECT_ID</key>
          	<string>color-rush-474ee</string>
          	<key>STORAGE_BUCKET</key>
          	<string>color-rush-474ee.firebasestorage.app</string>
          	<key>IS_ADS_ENABLED</key>
          	<false></false>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false></false>
          	<key>IS_APPINVITE_ENABLED</key>
          	<true></true>
          	<key>IS_GCM_ENABLED</key>
          	<true></true>
          	<key>IS_SIGNIN_ENABLED</key>
          	<true></true>
          	<key>GOOGLE_APP_ID</key>
          	<string>1:988545815222:ios:b47b1487610ec7f2a60c17</string>
          </dict>
          </plist>
          EOF

          # entitlement "Sign in with Apple" — exigido pra usar
          # ASAuthorizationController nativo (sem isso o app crasha/recusa na
          # hora de pedir o login com Apple). "associated-domains" (Universal
          # Links) — deixa o iOS abrir o app direto (em vez do Safari) quando
          # alguém toca num link de colorrush.com.br fora do app (ex: link de
          # pontuação/indicação compartilhado no WhatsApp) — precisa bater com
          # o applinks:colorrush.com.br do .well-known/apple-app-site-association
          # hospedado no próprio site (ver esse arquivo pro appID com o Team ID).
          # "aps-environment" (Push Notifications) — faltava desde sempre;
          # sem isso o iOS nunca autoriza o app a se registrar pra push, então
          # PushNotifications.register() falhava sempre, silenciosamente (ver
          # comentário do XCODE_MARKETING_VERSION acima). "production" porque
          # a distribuição aqui é sempre App Store, nunca desenvolvimento.
          cat > ios/App/App/App.entitlements << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>com.apple.developer.applesignin</key>
          	<array>
          		<string>Default</string>
          	</array>
          	<key>com.apple.developer.associated-domains</key>
          	<array>
          		<string>applinks:colorrush.com.br</string>
          	</array>
          	<key>aps-environment</key>
          	<string>production</string>
          </dict>
          </plist>
          EOF

          # URL scheme (REVERSED_CLIENT_ID) no Info.plist — o SDK nativo do
          # Google usa isso internamente. plistlib em vez de PlistBuddy
          # encadeado, pra não dar erro se CFBundleURLTypes já existir com
          # outra entrada (o cap add ios às vezes já cria uma pro próprio
          # esquema do app).
          python3 << 'PYEOF'
          import plistlib
          path = "ios/App/App/Info.plist"
          with open(path, "rb") as f:
              data = plistlib.load(f)
          url_types = data.get("CFBundleURLTypes", [])
          url_types.append({
              "CFBundleURLSchemes": ["com.googleusercontent.apps.988545815222-h08gpkp7bmc2usii6040d62eh9qlqq4r"]
          })
          data["CFBundleURLTypes"] = url_types
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          print("URL scheme do Google adicionado ao Info.plist")
          PYEOF

          # referencia os dois arquivos acima dentro do projeto Xcode — só
          # existir no disco não basta, o Xcode precisa saber que o
          # GoogleService-Info.plist é um recurso a empacotar e que
          # App.entitlements é o arquivo de entitlements do target. O
          # projeto nasce do zero a cada build (rm -rf ios lá em cima), então
          # não tem risco de duplicar referência de uma tentativa anterior.
          gem list -i xcodeproj > /dev/null 2>&1 || gem install xcodeproj --no-document
          ruby << 'RUBYEOF'
          require 'xcodeproj'

          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }
          raise 'target App não encontrado no projeto Xcode' unless target

          app_group = project.main_group.find_subpath('App', true)

          plist_ref = app_group.new_reference('GoogleService-Info.plist')
          target.add_resources([plist_ref])

          app_group.new_reference('App.entitlements')
          target.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end

          project.save
          puts 'Projeto Xcode atualizado: GoogleService-Info.plist (recurso) + App.entitlements (CODE_SIGN_ENTITLEMENTS)'
          RUBYEOF

          # confere se o AppDelegate encaminha URLs abertas pro Capacitor —
          # exigido pelo plugin pro fluxo nativo do Google (usa URL scheme
          # por baixo). O template padrão do Capacitor já inclui isso, mas
          # como o AppDelegate também nasce do zero em todo build, checa e
          # insere se por acaso faltar (não custa nada garantir).
          grep -q "ApplicationDelegateProxy.shared.application(app, open: url" ios/App/App/AppDelegate.swift || python3 << 'PYEOF'
          path = "ios/App/App/AppDelegate.swift"
          with open(path) as f:
              content = f.read()
          insertion = """
              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }
          """
          idx = content.rfind('}')
          content = content[:idx] + insertion + content[idx:]
          with open(path, 'w') as f:
              f.write(content)
          print('AppDelegate.swift: função de abertura de URL adicionada')
          PYEOF

          # mesma ideia acima, mas pro OUTRO evento que abre o app por fora —
          # Universal Links (Associated Domains), quando alguém toca num link
          # de colorrush.com.br fora do app (WhatsApp, Mensagens etc). É um
          # delegate diferente do "open url" (esse aqui usa NSUserActivity,
          # não URL scheme), por isso precisa do próprio encaminhamento.
          grep -q "ApplicationDelegateProxy.shared.application(application, continue: userActivity" ios/App/App/AppDelegate.swift || python3 << 'PYEOF'
          path = "ios/App/App/AppDelegate.swift"
          with open(path) as f:
              content = f.read()
          insertion = """
              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }
          """
          idx = content.rfind('}')
          content = content[:idx] + insertion + content[idx:]
          with open(path, 'w') as f:
              f.write(content)
          print('AppDelegate.swift: função de Universal Links (continue userActivity) adicionada')
          PYEOF

          # mesma ideia acima, mas pro registro de PUSH NOTIFICATION -- sem
          # esses dois delegates, o iOS registra o dispositivo (ou falha) mas
          # não tem como avisar o app: o PushNotifications.register() do
          # Capacitor resolve a Promise na hora (só confirma que PEDIU o
          # registro pro iOS), sem esperar o resultado de verdade, que só
          # chega depois por essas duas funções -- sem elas, nem o evento
          # "registration" nem "registrationError" disparam NUNCA, mesmo com
          # permissão concedida e tudo certo do lado JS (foi exatamente esse
          # sintoma que apareceu no diagnóstico remoto: chegou até
          # "register_returned" e parou, sem token nem erro). Usa
          # NotificationCenter (não ApplicationDelegateProxy como os dois
          # acima) porque é assim que o plugin @capacitor/push-notifications
          # espera receber esses eventos.
          grep -q "didRegisterForRemoteNotificationsWithDeviceToken" ios/App/App/AppDelegate.swift || python3 << 'PYEOF'
          path = "ios/App/App/AppDelegate.swift"
          with open(path) as f:
              content = f.read()
          insertion = """
              func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {
                  NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)
              }
              func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {
                  NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)
              }
          """
          idx = content.rfind('}')
          content = content[:idx] + insertion + content[idx:]
          with open(path, 'w') as f:
              f.write(content)
          print('AppDelegate.swift: delegates de registro de push adicionados')
          PYEOF
      - name: Declarar isenção de criptografia (evita a pergunta manual a cada envio)
        script: |
          # o app só usa HTTPS/TLS padrão do sistema (Firebase) — isso é
          # "uso isento" de criptografia pra fins de compliance de exportação,
          # então já marca isso direto no Info.plist gerado pelo cap add ios,
          # em vez de responder essa pergunta manualmente toda vez que subir
          # uma build no App Store Connect.
          PLIST="app/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
      - name: Configurar assinatura de código
        script: |
          xcode-project use-profiles
      - name: Incrementar número da build e versão (evita duplicidade/regressão no App Store Connect)
        script: |
          # o projeto iOS nasce do zero a cada build (rm -rf ios), sempre com
          # o número "1" — e a Apple recusa reenviar um número já usado pra
          # mesma versão. $BUILD_NUMBER é uma variável própria do Codemagic
          # que já vem incrementando sozinha a cada build deste app.
          #
          # já a versão "marketing" (CFBundleShortVersionString) também
          # nasce do zero como "1.0" a cada build (template padrão do
          # Xcode/Capacitor) — precisa ser maior que a última aprovada, por
          # isso aplica $XCODE_MARKETING_VERSION (definida ali em cima, nos
          # vars) por cima do valor gerado.
          cd app/ios/App
          agvtool new-version -all $BUILD_NUMBER
          agvtool new-marketing-version $XCODE_MARKETING_VERSION
      - name: Build do .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - igortmr@gmail.com
        notify:
          success: true
          failure: true
